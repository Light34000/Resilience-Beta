apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-alerts
    receivers:
      - uid: discord-alerts
        type: discord
        settings:
          url: $GRAFANA_DISCORD_WEBHOOK_URL
          use_discord_username: false

policies:
  - orgId: 1
    receiver: discord-alerts
    group_by: ["alertname", "scenario"]
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 1m
